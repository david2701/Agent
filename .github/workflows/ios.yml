name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared logic (models, API, dates, voice): it also runs on Linux.
  kairokit:
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: KairoCore tests
        working-directory: ios/KairoKit
        run: swift test

  # iPhone/iPad app, widgets, Live Activities, share extension and Apple Watch (Xcode 27, iOS 27 SDK).
  xcode:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei "ios|watch" || true
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      - name: Apple Watch (simulator)
        id: watch
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -quiet -project Kairo.xcodeproj -scheme KairoWatch \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-watch.log
      - name: iPhone and iPad (simulator)
        id: ios
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -quiet -project Kairo.xcodeproj -scheme Kairo \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-ios.log
      - name: Error summary
        if: always()
        working-directory: ios
        run: |
          for f in build-watch.log build-ios.log; do
            [ -f "$f" ] || continue
            echo "=== $f"
            grep -E "error:|fatal:" "$f" | sed -E 's#^.*/ios/##' | sort -u | head -150 || true
          done
          if [ "${{ steps.watch.outcome }}" != "success" ] || [ "${{ steps.ios.outcome }}" != "success" ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-logs
          path: ios/build-*.log
          if-no-files-found: ignore

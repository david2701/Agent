name: CI

on:
  push:
    branches: [main, kairo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas del backend
        working-directory: backend
        run: ./gradlew test --no-daemon

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Tipos y build
        working-directory: dashboard
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK del teléfono y del reloj
        working-directory: android
        run: ./gradlew :app:assembleRelease :wear:assembleRelease :app:testDebugUnitTest --tests "app.kairo.android.VoiceLogicTest" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kairo-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/wear/build/outputs/apk/release/*.apk

  docker:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/kairo')
    needs: [backend, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kairo:latest
            ghcr.io/${{ github.repository_owner }}/kairo:${{ github.sha }}

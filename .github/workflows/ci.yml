name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Types and build
        working-directory: dashboard
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Signs with your keystore if you define the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD
      # (and optionally ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD); otherwise with the debug key.
      # The repository variable KAIRO_SERVER_URL sets your server (the watch pairs against it).
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No keystore: the release is signed with the debug key"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kairo-release.jks"
          {
            echo "KAIRO_KEYSTORE_FILE=$RUNNER_TEMP/kairo-release.jks"
            echo "KAIRO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            [ -n "$KEY_ALIAS" ] && echo "KAIRO_KEY_ALIAS=$KEY_ALIAS"
            [ -n "$KEY_PASSWORD" ] && echo "KAIRO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Phone and watch APKs
        working-directory: android
        env:
          KAIRO_SERVER_URL: ${{ vars.KAIRO_SERVER_URL }}
        run: |
          [ -n "$KAIRO_SERVER_URL" ] || unset KAIRO_SERVER_URL
          ./gradlew :app:assembleRelease :wear:assembleRelease :app:testDebugUnitTest --tests "app.kairo.android.VoiceLogicTest" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kairo-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/wear/build/outputs/apk/release/*.apk

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kairo:latest
            ghcr.io/${{ github.repository_owner }}/kairo:${{ github.sha }}

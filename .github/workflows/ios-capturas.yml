name: iOS capturas

# Capturas de la app en el simulador de iPhone y iPad contra un servidor de prueba (ios/ci).
# No corre en cada cambio: se lanza a mano (Actions > iOS capturas > Run workflow) o al cambiar el
# propio script de capturas. Por defecto sólo iPhone (unos 8 minutos); el iPad tarda bastante más.
on:
  push:
    paths: ["ios/ci/screenshots.sh"]
  workflow_dispatch:
    inputs:
      ipad:
        description: "También capturas de iPad (más lento)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capturas:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar para el simulador
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -quiet -project Kairo.xcodeproj -scheme Kairo \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -50
      - name: Capturas
        working-directory: ios
        env:
          KAIRO_SHOTS_IPAD: ${{ inputs.ipad && '1' || '' }}
        run: bash ci/screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Kairo.app build/capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-ios
          path: ios/build/capturas
          if-no-files-found: ignore

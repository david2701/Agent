# Kairo Xcode project for iPhone, iPad (and iPhone Duo) and Apple Watch.
# Kairo.xcodeproj is generated from this file with XcodeGen and is already included in the repo:
#   brew install xcodegen && cd ios && xcodegen        (only if you change this file)
#
# Before building on your Mac, put your team and identifiers in Config/Signing.xcconfig.
#
# Languages: English is the development language and Spanish (es) is a full translation. Strings live in
# String Catalogs (*.xcstrings) next to each target's sources; XcodeGen adds them to the target's Resources
# automatically (use a recent XcodeGen, which recognizes .xcstrings). If you regenerate the project,
# check that `knownRegions` in the project contains en, es and Base.

name: Kairo
options:
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.0"
  defaultConfig: Debug

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KairoKit:
    path: KairoKit

targets:

  # ---------------------------------------------------------------- iPhone and iPad
  Kairo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: KairoKit
        product: KairoCore
      - package: KairoKit
        product: KairoUI
      - target: KairoWidgets
      - target: KairoShare
      - target: KairoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KAIRO_BUNDLE_ID)
        PRODUCT_NAME: Kairo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    entitlements:
      path: App/Kairo.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - $(KAIRO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KAIRO_KEYCHAIN_GROUP)
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        KairoAppGroup: $(KAIRO_APP_GROUP)
        KairoKeychainGroup: $(AppIdentifierPrefix)$(KAIRO_KEYCHAIN_GROUP)
        KairoDefaultServer: $(KAIRO_DEFAULT_SERVER)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
          - processing
          - remote-notification
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - $(KAIRO_BUNDLE_ID).sync
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # English base values; the Spanish ones live in App/Resources/InfoPlist.xcstrings
        NSMicrophoneUsageDescription: Kairo listens when you talk to it and records the meetings you ask it to.
        NSSpeechRecognitionUsageDescription: To recognize "Hey Kairo" on the phone itself, without sending audio until you say it.
        NSLocationWhenInUseUsageDescription: To save places and give you the weather where you are.
        NSLocationAlwaysAndWhenInUseUsageDescription: To notify you when you arrive at or leave the places in your reminders.
        NSAlarmKitUsageDescription: Kairo sets the alarms and timers you ask it for.
        NSUserActivityTypes:
          - $(KAIRO_BUNDLE_ID).talk
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: $(KAIRO_BUNDLE_ID)
            CFBundleURLSchemes: [kairo]

  # ---------------------------------------------------------------- Widgets, Live Activities and controls
  KairoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
        excludes:
          - "Watch/**"
    dependencies:
      - package: KairoKit
        product: KairoCore
      - package: KairoKit
        product: KairoUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KAIRO_BUNDLE_ID).widgets
        PRODUCT_NAME: KairoWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/KairoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KAIRO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KAIRO_KEYCHAIN_GROUP)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KairoAppGroup: $(KAIRO_APP_GROUP)
        KairoKeychainGroup: $(AppIdentifierPrefix)$(KAIRO_KEYCHAIN_GROUP)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ---------------------------------------------------------------- Save to Kairo (share extension)
  KairoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared/AppConfig.swift
    dependencies:
      - package: KairoKit
        product: KairoCore
      - package: KairoKit
        product: KairoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KAIRO_BUNDLE_ID).share
        PRODUCT_NAME: KairoShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    entitlements:
      path: Share/KairoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KAIRO_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KAIRO_KEYCHAIN_GROUP)
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Save to Kairo
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KairoAppGroup: $(KAIRO_APP_GROUP)
        KairoKeychainGroup: $(AppIdentifierPrefix)$(KAIRO_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  # ---------------------------------------------------------------- Apple Watch
  KairoWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared/AppConfig.swift
      - path: Shared/Watch
    dependencies:
      - package: KairoKit
        product: KairoCore
      - package: KairoKit
        product: KairoUI
      - target: KairoWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KAIRO_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: KairoWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    entitlements:
      path: Watch/KairoWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KAIRO_WATCH_APP_GROUP)
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(KAIRO_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        KairoAppGroup: $(KAIRO_WATCH_APP_GROUP)
        KairoDefaultServer: $(KAIRO_DEFAULT_SERVER)
        NSMicrophoneUsageDescription: Kairo listens when you talk to it from your watch.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  KairoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared/AppConfig.swift
    dependencies:
      - package: KairoKit
        product: KairoCore
      - package: KairoKit
        product: KairoUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KAIRO_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: KairoWatchWidgets
        SKIP_INSTALL: YES
    entitlements:
      path: WatchWidgets/KairoWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(KAIRO_WATCH_APP_GROUP)
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kairo
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KairoAppGroup: $(KAIRO_WATCH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Kairo:
    build:
      targets:
        Kairo: all
    run:
      config: Debug
    archive:
      config: Release
  KairoWatch:
    build:
      targets:
        KairoWatch: all
    run:
      config: Debug

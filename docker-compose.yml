# Kairo: API + dashboard + Postgres with pgvector.
#   1) ./scripts/generate-env.sh       (creates .env with random secrets)
#   2) edit .env (NAN_API_KEY, email and domain)
#   3) docker compose up -d --build
# Behind Caddy: see deploy/Caddyfile.example

name: kairo

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairo
      POSTGRES_DB: kairo
      POSTGRES_PASSWORD: ${KAIRO_DB_PASSWORD:?Set KAIRO_DB_PASSWORD in .env}
    volumes:
      - kairo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kairo]

  kairo:
    build:
      context: .
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: kairo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      KAIRO_DB_URL: jdbc:postgresql://db:5432/kairo
      KAIRO_DB_USER: kairo
    # Optional, Apple push: mount the .p8 key and set APNS_PRIVATE_KEY_FILE=/run/secrets/apns.p8 in .env
    # volumes:
    #   - ./secrets/AuthKey_XXXXXXXXXX.p8:/run/secrets/apns.p8:ro
    depends_on:
      db:
        condition: service_healthy
    # Localhost only: Caddy publishes HTTPS. If Caddy runs in Docker, join it to the "kairo" network.
    ports:
      - "127.0.0.1:${KAIRO_HOST_PORT:-8080}:8080"
    networks: [kairo]

  # Daily database backup (notes, attachments and everything else) in ./backups.
  # Each successful backup updates ./backups/LAST_BACKUP_OK.
  # Copy ./backups off the server from time to time (and keep your .env in a safe place).
  backup:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: kairo
      PGDATABASE: kairo
      PGPASSWORD: ${KAIRO_DB_PASSWORD:?Set KAIRO_DB_PASSWORD in .env}
      TZ: ${KAIRO_TIMEZONE:-UTC}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [kairo]

  # Optional: own push for the phones (UnifiedPush), without Firebase. Enabled with:
  #   docker compose --profile push up -d
  # Publish it with Caddy (deploy/Caddyfile.example) and install the ntfy app on each phone pointing to it.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    profiles: ["push"]
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-https://ntfy.yourdomain.com}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_ENABLE_SIGNUP: "false"
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "127.0.0.1:${NTFY_HOST_PORT:-8090}:80"
    networks: [kairo]

volumes:
  kairo-db:
  ntfy-data:

networks:
  kairo:
    name: kairo

# Kairo: API + dashboard + Postgres con pgvector.
#   1) ./scripts/generate-env.sh       (crea .env con secretos aleatorios)
#   2) edita .env (NAN_API_KEY, correo y dominio)
#   3) docker compose up -d --build
# Detrás de Caddy: ver deploy/Caddyfile.example

name: kairo

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairo
      POSTGRES_DB: kairo
      POSTGRES_PASSWORD: ${KAIRO_DB_PASSWORD:?Define KAIRO_DB_PASSWORD en .env}
    volumes:
      - kairo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kairo]

  kairo:
    build:
      context: .
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: kairo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      KAIRO_DB_URL: jdbc:postgresql://db:5432/kairo
      KAIRO_DB_USER: kairo
    # Opcional, push de Apple: monta la clave .p8 y pon APNS_PRIVATE_KEY_FILE=/run/secrets/apns.p8 en .env
    # volumes:
    #   - ./secrets/AuthKey_XXXXXXXXXX.p8:/run/secrets/apns.p8:ro
    depends_on:
      db:
        condition: service_healthy
    # Solo en localhost: Caddy publica HTTPS. Si Caddy corre en Docker, únelo a la red "kairo".
    ports:
      - "127.0.0.1:${KAIRO_HOST_PORT:-8080}:8080"
    networks: [kairo]

  # Opcional: push propio para los teléfonos (UnifiedPush), sin Firebase. Se activa con:
  #   docker compose --profile push up -d
  # Publícalo con Caddy (deploy/Caddyfile.example) y en cada teléfono instala la app ntfy apuntando a él.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    profiles: ["push"]
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-https://ntfy.tudominio.com}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_ENABLE_SIGNUP: "false"
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "127.0.0.1:${NTFY_HOST_PORT:-8090}:80"
    networks: [kairo]

volumes:
  kairo-db:
  ntfy-data:

networks:
  kairo:
    name: kairo
